<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>soom playground</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f5; --fg: #1d1d1b; --muted: #77756f; --card: #ffffff; --line: #e4e2dc; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #f1efe8; --muted: #a09e97; --card: #1e1e1c; --line: #33322f; } }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 880px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; place-items: center; gap: 10px; }
    .card code { color: var(--muted); font-size: 13px; }
    .card.dark { background: #0b0b10; border-color: #0b0b10; }
    .controls { display: grid; grid-template-columns: 80px 1fr 48px; gap: 10px 12px; align-items: center; margin: 28px 0; }
    .controls label { color: var(--muted); }
    .sizes { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>soom</h1>
    <div class="grid" id="grid"></div>

    <div class="controls">
      <label for="count">count</label><input id="count" type="range" min="40" max="600" step="10" value="180" /><span id="countOut">180</span>
      <label for="speed">speed</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1" /><span id="speedOut">1.0</span>
      <label for="size">size</label><input id="size" type="range" min="16" max="200" step="4" value="120" /><span id="sizeOut">120</span>
      <label for="color">color</label><input id="color" type="color" value="#000000" /><span></span>
    </div>

    <div class="sizes">
      <soom-loader size="16"></soom-loader>
      <soom-loader size="24"></soom-loader>
      <soom-loader size="32" variant="wave"></soom-loader>
      <soom-loader size="48" variant="morph"></soom-loader>
      <span>color 생략 시 기본값 #000000</span>
    </div>
  </main>
  <script type="module">
    import "../packages/web/src/auto.ts";
    import { VARIANTS, SHADER_VARIANTS } from "../packages/web/src/index.ts";

    const grid = document.getElementById("grid");
    const addCard = (variant, { dark = false, label = `variant="${variant}"` } = {}) => {
      const card = document.createElement("div");
      card.className = dark ? "card dark" : "card";
      const el = document.createElement("soom-loader");
      el.setAttribute("variant", variant);
      el.setAttribute("size", "120");
      const code = document.createElement("code");
      code.textContent = label;
      card.append(el, code);
      grid.append(card);
      return el;
    };
    const loaders = [
      ...Object.keys(VARIANTS).map((v) => addCard(v)),
      // Shader variants (WebGL prototype), on light and dark backgrounds.
      ...SHADER_VARIANTS.flatMap((v) => [addCard(v), addCard(v, { dark: true, label: `variant="${v}" · dark` })]),
    ];

    const bind = (id, attr, fmt = (v) => v) => {
      const input = document.getElementById(id);
      const out = document.getElementById(id + "Out");
      input.addEventListener("input", () => {
        if (out) out.textContent = fmt(input.value);
        loaders.forEach((el) => el.setAttribute(attr, input.value));
      });
    };
    bind("count", "count");
    bind("speed", "speed", (v) => Number(v).toFixed(1));
    bind("size", "size");
    bind("color", "color");
  </script>
</body>
</html>
