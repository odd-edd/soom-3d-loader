# Push a tag like v0.2.0 (after `npm run version:set -- 0.2.0`) to release.
# For now only the web package is published (npm). iOS will need no step here: Swift Package
# Manager reads the tag directly once the repo is public. Android publishing is not set up yet.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Tag matches package version
        run: test "v$(node -p "require('./packages/web/package.json').version")" = "$GITHUB_REF_NAME"
      # npm provenance only works from public repositories, so add it once the repo is public.
      - run: npm publish -w @odd-edd/soom --access public ${{ github.event.repository.private && ' ' || '--provenance' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
